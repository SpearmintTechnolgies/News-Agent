<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flying Unicorn ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 50%, #4a2c6e 100%);
            overflow: hidden;
            position: relative;
        }

        /* Stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Moon */
        .moon {
            position: fixed;
            top: 10%;
            right: 15%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #fffacd, #ffd700);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }

        /* Clouds */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            animation: float 20s infinite linear;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
        }

        @keyframes float {
            from { transform: translateX(-200px); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        /* Unicorn Container */
        .unicorn-container {
            position: fixed;
            top: 50%;
            left: -200px;
            transform: translateY(-50%);
            animation: fly 12s infinite linear;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        @keyframes fly {
            0% { left: -200px; }
            100% { left: calc(100% + 200px); }
        }

        /* Unicorn Body - CSS Art */
        .unicorn {
            position: relative;
            width: 150px;
            height: 100px;
        }

        /* Body */
        .body {
            position: absolute;
            width: 90px;
            height: 50px;
            background: linear-gradient(135deg, #fff 0%, #ffe6f7 100%);
            border-radius: 50px;
            top: 35px;
            left: 30px;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.1);
        }

        /* Neck and Head */
        .neck {
            position: absolute;
            width: 30px;
            height: 40px;
            background: linear-gradient(135deg, #fff 0%, #ffe6f7 100%);
            border-radius: 15px;
            top: 15px;
            left: 95px;
            transform: rotate(-15deg);
        }

        .head {
            position: absolute;
            width: 45px;
            height: 35px;
            background: linear-gradient(135deg, #fff 0%, #ffe6f7 100%);
            border-radius: 20px 20px 15px 15px;
            top: 0;
            left: 105px;
        }

        /* Snout */
        .snout {
            position: absolute;
            width: 25px;
            height: 20px;
            background: linear-gradient(135deg, #ffe6f7 0%, #ffb3d9 100%);
            border-radius: 50%;
            top: 12px;
            left: 135px;
        }

        /* Eye */
        .eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #1a0a2e;
            border-radius: 50%;
            top: 10px;
            left: 120px;
            animation: blink 3s infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            top: 1px;
            right: 2px;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Rainbow Horn */
        .horn {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 25px solid;
            border-image: linear-gradient(180deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff, #9b59b6) 1;
            top: -15px;
            left: 115px;
            transform: rotate(-10deg);
            filter: drop-shadow(0 0 5px rgba(255, 107, 107, 0.5));
        }

        /* Rainbow Horn (using clip-path for better gradient) */
        .horn-real {
            position: absolute;
            width: 12px;
            height: 25px;
            background: linear-gradient(180deg, 
                #ff6b6b 0%, 
                #ffd93d 25%, 
                #6bcf7f 50%, 
                #4d96ff 75%, 
                #9b59b6 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            top: -18px;
            left: 113px;
            transform: rotate(-10deg);
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        /* Ears */
        .ear {
            position: absolute;
            width: 15px;
            height: 20px;
            background: linear-gradient(135deg, #fff 0%, #ffe6f7 100%);
            border-radius: 50% 50% 0 50%;
            top: -5px;
            left: 110px;
            transform: rotate(-20deg);
        }

        .ear-inner {
            position: absolute;
            width: 8px;
            height: 12px;
            background: #ffb3d9;
            border-radius: 50% 50% 0 50%;
            top: -2px;
            left: 112px;
            transform: rotate(-20deg);
        }

        /* Mane */
        .mane {
            position: absolute;
            width: 40px;
            height: 50px;
            top: -5px;
            left: 85px;
        }

        .mane-hair {
            position: absolute;
            width: 15px;
            height: 25px;
            border-radius: 50%;
            animation: wave 1.5s ease-in-out infinite;
        }

        .mane-hair:nth-child(1) { 
            background: linear-gradient(180deg, #ff6b6b, #ff8e8e); 
            left: 0; top: 0; 
            animation-delay: 0s;
        }
        .mane-hair:nth-child(2) { 
            background: linear-gradient(180deg, #ffd93d, #ffe066); 
            left: 8px; top: 5px; 
            animation-delay: 0.1s;
        }
        .mane-hair:nth-child(3) { 
            background: linear-gradient(180deg, #6bcf7f, #8fd9a8); 
            left: 15px; top: 10px; 
            animation-delay: 0.2s;
        }
        .mane-hair:nth-child(4) { 
            background: linear-gradient(180deg, #4d96ff, #7db5ff); 
            left: 5px; top: 20px; 
            animation-delay: 0.3s;
        }
        .mane-hair:nth-child(5) { 
            background: linear-gradient(180deg, #9b59b6, #bb8fce); 
            left: 12px; top: 30px; 
            animation-delay: 0.4s;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
        }

        /* Tail */
        .tail {
            position: absolute;
            width: 50px;
            height: 40px;
            top: 30px;
            left: -10px;
        }

        .tail-hair {
            position: absolute;
            width: 20px;
            height: 35px;
            border-radius: 50%;
            animation: tail-wave 1.5s ease-in-out infinite;
        }

        .tail-hair:nth-child(1) { 
            background: linear-gradient(180deg, #9b59b6, #bb8fce); 
            left: 0; top: 0; 
            animation-delay: 0s;
        }
        .tail-hair:nth-child(2) { 
            background: linear-gradient(180deg, #4d96ff, #7db5ff); 
            left: 8px; top: 5px; 
            animation-delay: 0.1s;
        }
        .tail-hair:nth-child(3) { 
            background: linear-gradient(180deg, #6bcf7f, #8fd9a8); 
            left: 15px; top: 10px; 
            animation-delay: 0.2s;
        }
        .tail-hair:nth-child(4) { 
            background: linear-gradient(180deg, #ffd93d, #ffe066); 
            left: 5px; top: 15px; 
            animation-delay: 0.3s;
        }

        @keyframes tail-wave {
            0%, 100% { transform: rotate(-10deg) translateX(0); }
            50% { transform: rotate(10deg) translateX(3px); }
        }

        /* Wings */
        .wings {
            position: absolute;
            top: 15px;
            left: 40px;
            z-index: -1;
        }

        .wing {
            position: absolute;
            width: 60px;
            height: 40px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(200, 230, 255, 0.7) 50%,
                rgba(255, 182, 193, 0.5) 100%);
            border-radius: 0 80% 80% 80%;
            transform-origin: bottom left;
            animation: flap 0.3s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .wing.back {
            left: 5px;
            top: 5px;
            width: 50px;
            height: 35px;
            animation-delay: 0.05s;
            opacity: 0.7;
        }

        @keyframes flap {
            0%, 100% { transform: rotate(-20deg) scaleY(1); }
            50% { transform: rotate(-45deg) scaleY(0.8); }
        }

        /* Sparkles trail */
        .sparkles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #fff 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: sparkle-fade 1s forwards;
        }

        .sparkle::before,
        .sparkle::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 2px;
        }

        .sparkle::before {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        .sparkle::after {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        @keyframes sparkle-fade {
            0% { 
                transform: scale(0) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: scale(1.5) rotate(180deg); 
                opacity: 0; 
            }
        }

        /* Rainbow trail */
        .rainbow-trail {
            position: fixed;
            height: 4px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0.6;
            animation: trail-fade 2s forwards;
        }

        @keyframes trail-fade {
            0% { opacity: 0.6; transform: scaleX(1); }
            100% { opacity: 0; transform: scaleX(0.5); }
        }

        /* Info text */
        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Stars -->
    <div class="stars" id="stars"></div>
    
    <!-- Moon -->
    <div class="moon"></div>
    
    <!-- Clouds -->
    <div class="clouds" id="clouds"></div>
    
    <!-- Sparkles container -->
    <div class="sparkles-container" id="sparkles"></div>
    
    <!-- Flying Unicorn -->
    <div class="unicorn-container" id="unicorn">
        <div class="unicorn">
            <!-- Tail -->
            <div class="tail">
                <div class="tail-hair"></div>
                <div class="tail-hair"></div>
                <div class="tail-hair"></div>
                <div class="tail-hair"></div>
            </div>
            
            <!-- Wings -->
            <div class="wings">
                <div class="wing back"></div>
                <div class="wing"></div>
            </div>
            
            <!-- Body parts -->
            <div class="body"></div>
            <div class="neck"></div>
            <div class="head"></div>
            <div class="snout"></div>
            <div class="ear"></div>
            <div class="ear-inner"></div>
            <div class="horn-real"></div>
            <div class="eye"></div>
            
            <!-- Mane -->
            <div class="mane">
                <div class="mane-hair"></div>
                <div class="mane-hair"></div>
                <div class="mane-hair"></div>
                <div class="mane-hair"></div>
                <div class="mane-hair"></div>
            </div>
        </div>
    </div>
    
    <div class="info">✨ Flying Unicorn ✨</div>

    <script>
        // Generate random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
        }

        // Generate clouds
        const cloudsContainer = document.getElementById('clouds');
        const cloudCount = 5;
        for (let i = 0; i < cloudCount; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            const width = 100 + Math.random() * 100;
            const height = 40 + Math.random() * 30;
            cloud.style.width = width + 'px';
            cloud.style.height = height + 'px';
            cloud.style.top = (Math.random() * 60 + 10) + '%';
            cloud.style.left = -200 + 'px';
            cloud.style.animationDuration = (15 + Math.random() * 20) + 's';
            cloud.style.animationDelay = (Math.random() * 10) + 's';
            
            // Add cloud puffs
            const before = document.createElement('div');
            before.style.cssText = `
                content: '';
                position: absolute;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 100px;
                width: ${width * 0.5}px;
                height: ${height * 1.2}px;
                top: -${height * 0.4}px;
                left: ${width * 0.15}px;
            `;
            
            const after = document.createElement('div');
            after.style.cssText = `
                content: '';
                position: absolute;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 100px;
                width: ${width * 0.4}px;
                height: ${height * 0.9}px;
                top: -${height * 0.2}px;
                left: ${width * 0.45}px;
            `;
            
            cloud.appendChild(before);
            cloud.appendChild(after);
            cloudsContainer.appendChild(cloud);
        }

        // Create sparkles trail
        const sparklesContainer = document.getElementById('sparkles');
        const unicorn = document.getElementById('unicorn');
        const rainbowColors = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff', '#9b59b6'];
        
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            const size = 5 + Math.random() * 10;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            sparklesContainer.appendChild(sparkle);
            
            setTimeout(() => sparkle.remove(), 1000);
        }

        function createRainbowTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'rainbow-trail';
            const color = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
            trail.style.background = color;
            trail.style.left = (x - 30) + 'px';
            trail.style.top = (y + 40) + 'px';
            trail.style.width = (40 + Math.random() * 20) + 'px';
            sparklesContainer.appendChild(trail);
            
            setTimeout(() => trail.remove(), 2000);
        }

        // Track unicorn position and create effects
        let lastX = 0;
        let lastY = 0;
        let frameCount = 0;
        
        function updateTrail() {
            const rect = unicorn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Only create effects if unicorn has moved
            if (frameCount % 5 === 0 && (Math.abs(centerX - lastX) > 5 || Math.abs(centerY - lastY) > 5)) {
                // Create sparkle at tail position
                createSparkle(rect.left + 20, centerY + 30);
                
                // Occasionally create rainbow trail
                if (Math.random() > 0.5) {
                    createRainbowTrail(rect.left, centerY + 30);
                }
            }
            
            lastX = centerX;
            lastY = centerY;
            frameCount++;
            requestAnimationFrame(updateTrail);
        }
        
        updateTrail();

        // Add click interaction - jump effect
        document.addEventListener('click', (e) => {
            unicorn.style.animation = 'none';
            unicorn.offsetHeight; // Trigger reflow
            unicorn.style.top = (Math.random() * 60 + 20) + '%';
            unicorn.style.animation = 'fly 12s infinite linear';
        });
    </script>
</body>
</html>
